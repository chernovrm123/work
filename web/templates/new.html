{{define "title"}}Новая трата{{end}}

{{define "content"}}
<h1>Новая трата</h1>

{{if .Error}}<p class="error">{{.Error}}</p>{{end}}

<form method="POST" action="/expenses">
  <label>
    Сумма, ₽
    <input type="text" name="amount" inputmode="decimal" value="{{.Amount}}" placeholder="250 или 99,90" required>
  </label>

  <label>
    Описание
    <input type="text" name="description" value="{{.Description}}" placeholder="Например, продукты" required>
  </label>

  <label>
    Дата
    <input type="date" name="date" value="{{.Date}}" required>
  </label>

  <button type="submit">Добавить</button>
  <a href="/expenses">Отмена</a>
</form>
{{end}}
